name: Deploy Spring Boot to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: my-springboot-app
          # Go to Azure Portal, find your Web App, in the left menu, find "Get publish profile", click it, and
          # copy the content of the downloaded file into GitHub Secrets as AZURE_PUBLISH_PROFILE
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: target/app.jar